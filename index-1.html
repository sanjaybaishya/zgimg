<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>Zubeen Garg</title>
<style>
:root{--bg:#07080b;--card:#101218;--muted:#858995;--line:#ffffff14;--white:#f7f7f5}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% -100px,#20232d 0%,#0d0f14 38%,var(--bg) 72%);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{width:min(1080px,100%);margin:auto;padding:clamp(22px,5vw,56px) 18px 40px}.top{text-align:center;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#777b87;margin-bottom:12px}.title{font-size:clamp(44px,10vw,84px);line-height:.9;letter-spacing:-.065em;font-weight:800;margin:0}.subtitle{font-size:14px;color:#858995;margin:14px 0 0}.stage{position:relative;width:100%;height:min(68vh,720px);min-height:430px;border-radius:30px;background:linear-gradient(145deg,#151821,#0d0f14);border:1px solid var(--line);box-shadow:0 35px 100px #000b, inset 0 1px #ffffff08;overflow:hidden}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 65%,#0005)}#photo{width:100%;height:100%;display:block;object-fit:contain;opacity:0;transition:opacity .4s ease}.loaded{opacity:1!important}.loader{position:absolute;inset:0;display:grid;place-items:center}.loader i{width:30px;height:30px;border:2px solid #ffffff20;border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{appearance:none;border:1px solid var(--line);border-radius:15px;padding:14px 21px;font:700 14px inherit;cursor:pointer;background:#151820;color:#fff;box-shadow:0 12px 35px #0007;transition:transform .18s,background .18s}.btn.primary{background:#f5f5f2;color:#08090b;border-color:transparent}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:wait}.error{text-align:center;color:#eaa0a0;font-size:13px;margin-top:14px}.gallery{display:none;margin-top:28px;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.gallery.open{display:grid}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#11141a;cursor:pointer;transition:transform .2s,opacity .2s}.gallery img:hover{transform:scale(.985);opacity:.88}.back{display:none;margin:0 auto 18px}.gallery.open~.back{display:block}.footer{text-align:center;color:#555963;font-size:10px;margin-top:24px;letter-spacing:.04em}@media(max-width:650px){.app{padding-top:26px}.stage{height:64vh;min-height:380px;border-radius:24px}.gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.gallery img{border-radius:9px}.btn{padding:13px 17px}}@media(max-width:380px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="eyebrow">A Tribute</div><h1 class="title">Zubeen Garg</h1><p class="subtitle">Moments. Memories. Music.</p></header>
<section class="stage" id="stage"><div class="loader" id="loader"><i></i></div><img id="photo" alt=""></section>
<div class="actions"><button class="btn primary" id="random">✦ &nbsp;Another Moment</button><button class="btn" id="all">▦ &nbsp;View All</button></div>
<div class="error" id="error"></div>
<button class="btn back" id="back">↑ &nbsp;Back to Photo</button>
<section class="gallery" id="gallery" aria-label="Photo gallery"></section>
<footer class="footer">Zubeen Garg</footer>
</main>
<script>
let photos=[],current=-1,busy=false;
const photo=document.getElementById('photo'),loader=document.getElementById('loader'),random=document.getElementById('random'),all=document.getElementById('all'),gallery=document.getElementById('gallery'),error=document.getElementById('error'),stage=document.getElementById('stage'),back=document.getElementById('back');
async function load(){const r=await fetch('photos.json');if(!r.ok)throw Error();photos=await r.json();if(!photos.length)throw Error();}
function pick(){if(photos.length<2)return 0;let n;do n=Math.floor(Math.random()*photos.length);while(n===current);return n}
function display(n){current=n;loader.style.display='grid';photo.classList.remove('loaded');error.textContent='';random.disabled=true;const f=photos[n];photo.onload=()=>{loader.style.display='none';photo.classList.add('loaded');random.disabled=false};photo.onerror=()=>{loader.style.display='none';random.disabled=false;error.textContent='Unable to load this photo.'};photo.src='photos/'+encodeURIComponent(f)}
random.onclick=()=>{if(!busy){busy=true;display(pick());setTimeout(()=>busy=false,400)}};
all.onclick=async()=>{if(!photos.length)return;gallery.innerHTML='';for(let i=0;i<photos.length;i++){const im=document.createElement('img');im.loading='lazy';im.alt='';im.src='photos/'+encodeURIComponent(photos[i]);im.onclick=()=>{gallery.classList.remove('open');all.textContent='▦  View All';stage.scrollIntoView({behavior:'smooth',block:'start'});display(i)};gallery.appendChild(im)}gallery.classList.add('open');all.textContent='✕  Hide All';gallery.scrollIntoView({behavior:'smooth',block:'start'})};
all.addEventListener('click',()=>{if(all.textContent.includes('Hide')){gallery.classList.remove('open');all.textContent='▦  View All'}});
back.onclick=()=>stage.scrollIntoView({behavior:'smooth',block:'start'});
load().then(()=>display(pick())).catch(()=>{loader.style.display='none';error.textContent='Could not load the photo collection.'});
</script>
</body>
</html>
