<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<title>Zubeen Garg — Random Photo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08090d;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:18px}
.app{width:min(900px,100%);text-align:center;padding-top:8px}
.brand{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#a6a8b0;margin:8px 0 12px}
h1{font-size:clamp(38px,9vw,72px);line-height:.98;margin:0;font-weight:800;letter-spacing:-.04em}
.sub{color:#90939d;font-size:14px;margin:13px auto 24px;max-width:560px}
.photo-card{position:relative;width:100%;height:min(70vh,650px);min-height:420px;background:#11131a;border:1px solid #ffffff14;border-radius:28px;overflow:hidden;box-shadow:0 30px 90px #000b}
.photo-card img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease}
.photo-card img.visible{opacity:1}
.loader{position:absolute;inset:0;display:grid;place-items:center}
.spinner{width:38px;height:38px;border:3px solid #ffffff18;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.info{min-height:20px;margin-top:12px;color:#737782;font-size:12px}
button{appearance:none;border:0;background:#fff;color:#090a0f;border-radius:17px;padding:15px 24px;margin-top:18px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 12px 35px #0008}
button:active{transform:scale(.97)}
button:disabled{opacity:.55}
.counter{margin-top:12px;color:#5f626b;font-size:11px}
.hint{margin-top:16px;color:#555862;font-size:11px}
.error{color:#ff9d9d}
 .thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#111;cursor:pointer}
</style>
</head>
<body>
<main class="app">
  <div class="brand">Zubeen Garg Tribute</div>
  <h1>Random Photo</h1>
  <p class="sub">693 photos • Tap the button to discover another moment.</p>

  <section class="photo-card">
    <div class="loader" id="loader"><div class="spinner"></div></div>
    <img id="photo" alt="Zubeen Garg">
  </section>

  <div class="info" id="info"></div>
  <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button id="random">✦ Show Another Photo</button><button id="all" style="background:#171920;color:#fff;border:1px solid #ffffff18">▦ View All Photos</button></div>
  <div id="gallery" style="display:none;margin-top:24px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;text-align:left"></div>
  <div class="counter" id="counter"></div>
  <div class="hint">Photos are loaded from this GitHub Pages repository.</div>
</main>

<script>
let photos=[];
let current=-1;
const img=document.getElementById("photo");
const loader=document.getElementById("loader");
const info=document.getElementById("info");
const counter=document.getElementById("counter");
const btn=document.getElementById("random");
const allBtn=document.getElementById("all");
const gallery=document.getElementById("gallery");

async function loadManifest(){
  const r=await fetch("photos.json");
  if(!r.ok) throw new Error("photos.json not found");
  photos=await r.json();
  if(!photos.length) throw new Error("No photos found");
  document.querySelector(".sub").textContent=photos.length+" photos • Tap the button to discover another moment.";
}

function randomIndex(){
  if(photos.length===1)return 0;
  let n;
  do{n=Math.floor(Math.random()*photos.length)}while(n===current);
  return n;
}

function showRandom(){
  if(!photos.length)return;
  btn.disabled=true;
  loader.style.display="grid";
  img.classList.remove("visible");
  info.textContent="";
  const n=randomIndex();
  current=n;
  const file=photos[n];

  img.onload=()=>{
    loader.style.display="none";
    img.classList.add("visible");
    info.textContent=file;
    counter.textContent=`Photo ${n+1} of ${photos.length}`;
    btn.disabled=false;
  };
  img.onerror=()=>{
    loader.style.display="none";
    info.innerHTML='<span class="error">This photo could not be loaded. Tap again.</span>';
    btn.disabled=false;
  };
  img.src="photos/"+encodeURIComponent(file);
}

btn.addEventListener("click",showRandom);
loadManifest().then(showRandom).catch(e=>{
  loader.style.display="none";
  info.innerHTML='<span class="error">Could not load photos.json. Make sure it and the photos folder are uploaded.</span>';
});
</script>
</body>
</html>
