<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070709">
<title>Zubeen Garg — A Visual Tribute</title>
<style>
:root{
  --bg:#070709;
  --fg:#f7f5f0;
  --muted:#a6a29a;
  --line:#ffffff18;
  --glass:#111116b8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.app{min-height:100svh;position:relative;isolation:isolate;overflow:hidden}
.ambient{
  position:absolute;inset:-8%;
  background-position:center;
  background-size:cover;
  filter:blur(48px) saturate(.75);
  transform:scale(1.12);
  opacity:.34;
  transition:background-image .7s ease,opacity .7s ease;
  z-index:-3;
}
.ambient:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,#050507c9 0%,#070709ee 55%,#070709 100%);
}
.grain{
  position:absolute;inset:0;pointer-events:none;opacity:.035;z-index:5;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
}
.shell{
  width:min(1180px,100%);
  min-height:100svh;
  margin:auto;
  padding:24px 18px 28px;
  display:flex;
  flex-direction:column;
}
.top{
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;padding:4px 2px 22px;
}
.brand{
  font-size:11px;font-weight:700;letter-spacing:.25em;
  text-transform:uppercase;color:#d9d5ce;
}
.mark{
  width:34px;height:34px;border:1px solid var(--line);
  border-radius:50%;display:grid;place-items:center;
  color:#bbb7b0;font-size:12px;
}
.intro{text-align:center;padding:8px 0 22px}
.eyebrow{
  margin:0 0 12px;color:#918d86;font-size:10px;
  letter-spacing:.35em;text-transform:uppercase;
}
h1{
  margin:0;font-size:clamp(46px,9vw,88px);
  line-height:.88;letter-spacing:-.07em;font-weight:800;
}
.lead{
  margin:17px auto 0;max-width:500px;
  color:var(--muted);font-size:14px;line-height:1.55;
}
.frame{
  position:relative;
  flex:1;
  min-height:0;
  display:flex;align-items:center;justify-content:center;
}
.photo-wrap{
  position:relative;
  width:min(760px,100%);
  height:min(65svh,690px);
  min-height:410px;
  border-radius:28px;
  overflow:hidden;
  background:#0d0d11;
  border:1px solid var(--line);
  box-shadow:0 30px 90px #000b,0 0 0 1px #ffffff06 inset;
}
.photo-wrap:before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,#00000010 45%,#00000062 100%);
}
.photo-wrap:after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  box-shadow:inset 0 0 90px #0008;
}
#photo{
  width:100%;height:100%;display:block;
  object-fit:contain;
  opacity:0;
  transform:scale(1.025);
  transition:opacity .55s ease,transform .8s cubic-bezier(.2,.75,.2,1);
}
#photo.loaded{opacity:1;transform:scale(1)}
.loader{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
.spinner{
  width:30px;height:30px;border-radius:50%;
  border:1.5px solid #ffffff22;border-top-color:#fff;
  animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.controls{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
  z-index:4;width:min(92%,520px);
  display:flex;align-items:center;gap:8px;
  padding:7px;border:1px solid #ffffff1c;
  background:var(--glass);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:20px;box-shadow:0 16px 40px #0009;
}
.btn{
  appearance:none;border:0;cursor:pointer;
  min-height:48px;border-radius:14px;padding:0 18px;
  font:700 13px inherit;letter-spacing:.01em;
  color:#f5f3ee;background:#ffffff0d;
  transition:transform .18s ease,background .18s ease,opacity .18s ease;
}
.btn:active{transform:scale(.97)}
.btn.primary{flex:1;background:#f4f2ed;color:#080809}
.btn:not(.primary){flex:1}
.btn:disabled{opacity:.5;cursor:wait}
.error{
  text-align:center;color:#d99b9b;font-size:12px;
  margin:12px 0 0;min-height:16px;
}
.footer{
  text-align:center;padding-top:22px;color:#65626;
  color:#68655f;font-size:9px;letter-spacing:.28em;
  text-transform:uppercase;
}
@media(max-width:650px){
  .shell{padding:18px 13px 22px}
  .top{padding-bottom:14px}
  .intro{padding:5px 0 16px}
  .lead{font-size:13px;margin-top:14px}
  .photo-wrap{
    height:62svh;min-height:390px;border-radius:23px;
  }
  .controls{bottom:14px;border-radius:18px}
  .btn{padding:0 12px;font-size:12px}
}
@media(max-width:390px){
  h1{font-size:44px}
  .photo-wrap{min-height:360px}
  .controls{width:94%}
  .btn{padding:0 9px}
}
</style>
</head>
<body>
<main class="app">
  <div class="ambient" id="ambient"></div>
  <div class="grain"></div>

  <div class="shell">
    <header class="top">
      <div class="brand">A Visual Tribute</div>
      <div class="mark">ZG</div>
    </header>

    <section class="intro">
      <p class="eyebrow">Moments · Memories · Music</p>
      <h1>Zubeen Garg</h1>
      <p class="lead">One moment at a time. Discover a different photograph from the collection.</p>
    </section>

    <section class="frame">
      <div class="photo-wrap" id="stage">
        <div class="loader" id="loader"><div class="spinner"></div></div>
        <img id="photo" alt="Zubeen Garg">
        <div class="controls">
          <button class="btn primary" id="random">✦ &nbsp;Another Moment</button>
          <button class="btn" id="songs">♫ &nbsp;His Songs</button>
        </div>
      </div>
    </section>

    <div class="error" id="error"></div>
    <footer class="footer">Zubeen Garg</footer>
  </div>
</main>

<script>
let photos=[],current=-1,busy=false;

const photo=document.getElementById('photo');
const loader=document.getElementById('loader');
const random=document.getElementById('random');
const error=document.getElementById('error');
const ambient=document.getElementById('ambient');
const songs=document.getElementById('songs');

async function load(){
  const r=await fetch('photos.json');
  if(!r.ok) throw Error();
  photos=await r.json();
  if(!Array.isArray(photos)||!photos.length) throw Error();
}

function pick(){
  if(photos.length<2) return 0;
  let n;
  do n=Math.floor(Math.random()*photos.length);
  while(n===current);
  return n;
}

function display(n){
  current=n;
  loader.style.display='grid';
  photo.classList.remove('loaded');
  error.textContent='';
  random.disabled=true;

  const f=photos[n];
  const src='photos/'+encodeURIComponent(f);

  ambient.style.backgroundImage='url("'+src.replace(/"/g,'\\"')+'")';

  photo.onload=()=>{
    loader.style.display='none';
    photo.classList.add('loaded');
    random.disabled=false;
  };

  photo.onerror=()=>{
    loader.style.display='none';
    random.disabled=false;
    error.textContent='Unable to load this photo.';
  };

  photo.src=src;
}

random.onclick=()=>{
  if(busy) return;
  busy=true;
  display(pick());
  setTimeout(()=>busy=false,450);
};

songs.onclick=()=>{
  window.location.href='https://sanjaybaishya.github.io/ZG/';
};

load()
  .then(()=>display(pick()))
  .catch(()=>{
    loader.style.display='none';
    error.textContent='Could not load the photo collection.';
  });
</script>
</body>
</html>
